name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7.0.1

      # .NET Framework 4.8 ships with the OS and the VS MSBuild on windows-2022.
      - uses: microsoft/setup-msbuild@v3

      - name: Build (Release)
        run: msbuild CONTester.slnx /t:Rebuild /p:Configuration=Release /v:minimal /nologo

      - name: Determine version and short commit hash
        shell: pwsh
        run: |
          $version = (Get-Item 'CONTester\bin\Release\CONtester.exe').VersionInfo.ProductVersion
          $hash = (git rev-parse --short HEAD).Trim()
          $tag = if ($env:GITHUB_REF_NAME -like 'v*') { $env:GITHUB_REF_NAME } else { "v$version-$hash" }
          "VERSION=$version" >> $env:GITHUB_ENV
          "HASH=$hash" >> $env:GITHUB_ENV
          "TAG=$tag" >> $env:GITHUB_ENV
          "ASSET=CONtester-$version-$hash.exe" >> $env:GITHUB_ENV
          Write-Host "Version=$version Hash=$hash Tag=$tag"

      - name: Merge into a single executable
        shell: pwsh
        run: |
          $nuget = (Get-Command nuget.exe -ErrorAction SilentlyContinue).Source
          if (-not $nuget) { $nuget = 'C:\Program Files (x86)\NuGet\nuget.exe' }
          & $nuget install ILMerge -Version 3.0.41 -OutputDirectory tools -NonInteractive
          $ilmerge = Get-ChildItem tools -Recurse -Filter ILMerge.exe | Select-Object -First 1
          if (-not $ilmerge) { throw 'ILMerge.exe not found in NuGet package.' }

          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $runtime = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319"
          & $ilmerge.FullName `
            /ndebug `
            /out:"artifacts/$env:ASSET" `
            /targetplatform:"v4,$runtime" `
            'CONTester\bin\Release\CONtester.exe' `
            'CONTester\bin\Release\ISOLib.dll'
          if ($LASTEXITCODE -ne 0) { throw 'ILMerge failed.' }

          $unexpected = @(Get-ChildItem artifacts -File | Where-Object { $_.Extension -ne '.exe' })
          if ($unexpected.Count -gt 0) {
            throw "Unexpected release files (symbols/debug artifacts?): $($unexpected.Name -join ', ')"
          }

          $merged = Get-Item "artifacts/$env:ASSET"
          Write-Host "Single-file executable: $($merged.Name) ($($merged.Length) bytes), no symbols"

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: CONtester-release
          path: artifacts/*.exe
          if-no-files-found: error

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: ${{ env.TAG }}
          name: CONtester ${{ env.VERSION }} (${{ env.HASH }})
          generate_release_notes: true
          files: artifacts/*.exe
